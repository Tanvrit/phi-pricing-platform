kotlin.code.style=official
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g
# The Kotlin compile daemon is a SEPARATE JVM from the Gradle daemon, so the
# -Xmx above does not apply to it. Left unset, its default heap is far too
# small for this module graph and `./gradlew build` died with
#   e: java.lang.OutOfMemoryError: GC overhead limit exceeded
#   e: java.lang.OutOfMemoryError: Java heap space
# in org.jetbrains.kotlin.wasm.ir.convertors.WasmIrToBinary, failing
# :shared:sdk:sdk-audit, :sdk-ui-buyonline and :sdk-catalog on
# compileTestDevelopmentExecutableKotlinWasmJs. Emitting a wasm test
# executable holds the whole module's Wasm IR in memory, and with
# org.gradle.parallel=true several of those link steps share one daemon.
kotlin.daemon.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache OFF: the KMP + Compose plugins still trip it across a 20-module
# graph (matches tanvrit/core convention). Re-enable per-module once stable.
org.gradle.configuration-cache=false
kotlin.mpp.androidSourceSetLayoutVersion=2
# Default hierarchy template ON (removed the =false override) so intermediate source
# sets (jvmMain/wasmJsMain/iosMain/appleMain) exist for expect/actual in core-network,
# sdk-audit, etc. The retired :desktop/:buyonline modules that needed it off are gone.
kotlin.native.parallelism=1
# JVM toolchain: configured per-module via jvmToolchain(21). Removed hardcoded JBR path
# so CI agents and other developers don't depend on Vivek's local install.
