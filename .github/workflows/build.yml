name: build

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  build:
    # Self-hosted only — org policy 2026-09-11: no workflow in any Tanvrit repo
    # may name a GitHub-hosted image. This was `ubuntu-latest`. It is a Gradle
    # build and test, which the Linux X64 fleet already runs for every other
    # Kotlin repo. OS and architecture are named explicitly because
    # `group: tanvrit` alone is heterogeneous.
    runs-on:
      group: tanvrit
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
