ktor {
    deployment {
        port = 9090
        port = ${?PORT}
    }
    application {
        modules = [ com.rate.server.ApplicationKt.module ]
    }
}

database {
    url      = "jdbc:postgresql://localhost:5432/rate_calculator"
    url      = ${?DB_URL}
    driver   = "org.postgresql.Driver"
    user     = "rate_admin"
    user     = ${?DB_USER}
    # NO DEFAULT — fail fast if DB_PASSWORD env var isn't set. Previously hardcoded
    # to "rate123" which leaked into git history. Foundation Pack §1D.
    password = ${?DB_PASSWORD}
    maxPoolSize = 20
    maxPoolSize = ${?DB_POOL_SIZE}
}

security {
    # Comma-separated list of allowed origins for CORS. NEVER use anyHost() in prod.
    corsAllowedOrigins = "http://localhost:9090,http://localhost:8080"
    corsAllowedOrigins = ${?CORS_ALLOWED_ORIGINS}

    # 32-byte (recommended) secret for HMAC-signing short-lived OTP tokens.
    # Phase 2 will replace this whole token machinery with real JWT auth.
    otpTokenSecret = "development_only_32_byte_secret_change_me"
    otpTokenSecret = ${?OTP_TOKEN_SECRET}
}
