ktor {
    deployment {
        port = 9090
        port = ${?PORT}
    }
    application {
        modules = [ com.rate.server.ApplicationKt.module ]
    }
}

# ── Persistence: MongoDB only (Exposed/Flyway/Hikari/Postgres removed in the re-arch) ──
# The Mongo driver lives ONLY in :server-persistence; the URI (with credentials) is read
# from the environment by `MongoConfig.fromEnv()`. There is NO production default for the
# URI — a misconfigured deployment fail-fasts (mirrors the old DB_PASSWORD rule).
#   MONGO_URI  e.g. mongodb://rate_admin:****@localhost:27017/?authSource=admin
#   MONGO_DB   logical database name (default: rate)

security {
    # Comma-separated CORS allowlist. NEVER use anyHost() in prod. Env overrides this.
    corsAllowedOrigins = "http://localhost:9090,http://localhost:9092"
    corsAllowedOrigins = ${?CORS_ALLOWED_ORIGINS}

    # Secrets are read from the environment by `AppSecrets.fromEnv()` — NEVER stored here.
    # Required in production (no default → fail-fast):
    #   OTP_TOKEN_SECRET     HMAC secret for the OTP-token / idempotency hasher
    #   JWT_SIGNING_SECRET   HS256 access-token signing secret (falls back to OTP_TOKEN_SECRET)
    # AEGIS_DEV_PROFILE=true relaxes the fail-fast (dev/test only) + surfaces dev OTP codes.
}
